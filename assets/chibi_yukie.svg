<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="100%" height="100%">
<defs>
  <style>
    /* Only 3 animations, GPU-only properties */
    #g { animation: bob 3s ease-in-out infinite; will-change: transform; }
    #eo { animation: blinkO 5s ease-in-out infinite; transform-origin: 100px 94px; will-change: transform; }
    #ec { animation: blinkC 5s ease-in-out infinite; opacity:0; will-change: opacity; }
    #es { animation: xS 12s ease-in-out infinite; opacity:0; will-change: opacity; }
    #en { animation: xN 12s ease-in-out infinite; will-change: opacity; }
    #sh { animation: sh 3s ease-in-out infinite; transform-origin:100px 207px; will-change:transform,opacity; }

    @keyframes bob    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes sh     { 0%,100%{transform:scaleX(1);opacity:.16} 50%{transform:scaleX(.74);opacity:.08} }
    @keyframes blinkO { 0%,84%,94%,100%{transform:scaleY(1)} 89%{transform:scaleY(0.05)} }
    @keyframes blinkC { 0%,84%,94%,100%{opacity:0} 89%{opacity:1} }
    @keyframes xN     { 0%,40%{opacity:1} 44%,100%{opacity:0} }
    @keyframes xS     { 0%,42%{opacity:0} 46%,100%{opacity:1} }
  </style>
</defs>

<ellipse id="sh" cx="100" cy="207" rx="48" ry="6" fill="#000"/>

<g id="g">
  <!-- Tail -->
  <path d="M 96 194 Q 68 180 56 160 Q 48 144 61 134 Q 73 126 78 143 Q 82 155 91 163 Q 98 175 100 191 Z" fill="#1c1820" stroke="#0a0810" stroke-width="1.8"/>
  <ellipse cx="60" cy="135" rx="9" ry="6.5" fill="#e4daf0" transform="rotate(-28 60 135)"/>

  <!-- Ears -->
  <polygon points="46,76 64,18 92,70" fill="#1c1820" stroke="#0a0810" stroke-width="2.2"/>
  <polygon points="57,69 66,28 84,67" fill="#e06080" opacity="0.72"/>
  <polygon points="154,76 136,18 108,70" fill="#1c1820" stroke="#0a0810" stroke-width="2.2"/>
  <polygon points="143,69 134,28 116,67" fill="#e06080" opacity="0.72"/>

  <!-- Head -->
  <circle cx="100" cy="108" r="68" fill="#1c1820" stroke="#0a0810" stroke-width="2.5"/>

  <!-- Nose -->
  <path d="M 96 117 L 100 123 L 104 117 Q 100 112 96 117 Z" fill="#e0708a" stroke="#b05068" stroke-width="0.8"/>

  <!-- Whiskers (static — no animation cost) -->
  <line x1="80" y1="104" x2="28" y2="96"  stroke="#cac4de" stroke-width="1.6" stroke-linecap="round" opacity="0.82"/>
  <line x1="80" y1="111" x2="26" y2="111" stroke="#cac4de" stroke-width="1.6" stroke-linecap="round" opacity="0.82"/>
  <line x1="80" y1="118" x2="30" y2="125" stroke="#cac4de" stroke-width="1.6" stroke-linecap="round" opacity="0.82"/>
  <line x1="120" y1="104" x2="172" y2="96"  stroke="#cac4de" stroke-width="1.6" stroke-linecap="round" opacity="0.82"/>
  <line x1="120" y1="111" x2="174" y2="111" stroke="#cac4de" stroke-width="1.6" stroke-linecap="round" opacity="0.82"/>
  <line x1="120" y1="118" x2="170" y2="125" stroke="#cac4de" stroke-width="1.6" stroke-linecap="round" opacity="0.82"/>

  <!-- NEUTRAL EYES (shown 0-40%) -->
  <g id="en">
    <g id="eo">
      <ellipse cx="76"  cy="94" rx="16" ry="18" fill="#60c818"/>
      <ellipse cx="76"  cy="94" rx="6"  ry="13" fill="#0a0810"/>
      <circle  cx="70"  cy="87" r="5"   fill="#fff" opacity="0.9"/>
      <ellipse cx="124" cy="94" rx="16" ry="18" fill="#60c818"/>
      <ellipse cx="124" cy="94" rx="6"  ry="13" fill="#0a0810"/>
      <circle  cx="118" cy="87" r="5"   fill="#fff" opacity="0.9"/>
    </g>
    <g id="ec">
      <path d="M 60 92 Q 76 99 92 92"  fill="none" stroke="#0a0810" stroke-width="3" stroke-linecap="round"/>
      <path d="M 108 92 Q 124 99 140 92" fill="none" stroke="#0a0810" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Upper lash -->
    <path d="M 59 82 Q 76 76 93 82" fill="none" stroke="#0a0810" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 59 82 L 54 79" stroke="#0a0810" stroke-width="2" stroke-linecap="round"/>
    <path d="M 93 82 L 98 79" stroke="#0a0810" stroke-width="2" stroke-linecap="round"/>
    <path d="M 107 82 Q 124 76 141 82" fill="none" stroke="#0a0810" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 107 82 L 102 79" stroke="#0a0810" stroke-width="2" stroke-linecap="round"/>
    <path d="M 141 82 L 146 79" stroke="#0a0810" stroke-width="2" stroke-linecap="round"/>
    <!-- Neutral mouth -->
    <path d="M 91 128 Q 100 134 109 128" fill="none" stroke="#0a0810" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- SQUINT ^.^ (shown 44-100%) -->
  <g id="es">
    <path d="M 58 88 Q 76 78 94 88"  fill="#3a8818" stroke="#0a0810" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 106 88 Q 124 78 142 88" fill="#3a8818" stroke="#0a0810" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="59"  cy="108" rx="11" ry="7" fill="#e87090" opacity="0.24"/>
    <ellipse cx="141" cy="108" rx="11" ry="7" fill="#e87090" opacity="0.24"/>
    <path d="M 87 128 Q 100 138 113 128" fill="none" stroke="#0a0810" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Collar -->
  <path d="M 46 155 Q 100 167 154 155 Q 152 171 100 177 Q 48 171 46 155 Z" fill="#bbf438" stroke="#5aaa00" stroke-width="2"/>
  <circle cx="60"  cy="162" r="3.5" fill="#fff" stroke="#5aaa00" stroke-width="1"/>
  <circle cx="100" cy="166" r="3"   fill="#fff" stroke="#5aaa00" stroke-width="1"/>
  <circle cx="140" cy="162" r="3.5" fill="#fff" stroke="#5aaa00" stroke-width="1"/>

  <!-- Bell (static — removed swing animation to save perf) -->
  <line x1="100" y1="177" x2="100" y2="186" stroke="#b09010" stroke-width="2" stroke-linecap="round"/>
  <path d="M 92 186 Q 90 194 94 199 Q 100 203 106 199 Q 110 194 108 186 Z" fill="#f5d020" stroke="#a08010" stroke-width="1.5"/>
  <ellipse cx="100" cy="186" rx="8.5" ry="3.8" fill="#e8c020" stroke="#a08010" stroke-width="1.4"/>
  <circle cx="95.5" cy="190" r="2" fill="#fff" opacity="0.5"/>
</g>
</svg>
